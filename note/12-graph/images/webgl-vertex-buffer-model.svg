<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">WebGL vertex buffer mapping model</title>
  <desc id="desc">Vertex shader attribute locations select VAO attribute slots. Each enabled slot stores a format and a captured buffer reference used to decode raw bytes from buffer objects during a draw call.</desc>
  <defs>
    <style>
      .bg { fill: #111417; }
      .context { fill: #181d22; stroke: #3b4650; stroke-width: 2; }
      .shader { fill: #28221b; stroke: #d5a64a; stroke-width: 2; }
      .vao { fill: #20272d; stroke: #73808b; stroke-width: 2; }
      .slot { fill: #151a1e; stroke: #56616b; stroke-width: 2; }
      .buffer { fill: #202924; stroke: #69a97b; stroke-width: 2; }
      .api { fill: #1c2228; stroke: #6f8fa9; stroke-width: 2; }
      .draw { fill: #251f2b; stroke: #9d80bd; stroke-width: 2; }
      .title { fill: #f3f5f7; font: 700 32px 'Segoe UI', Arial, sans-serif; }
      .section { fill: #f3f5f7; font: 700 24px 'Segoe UI', Arial, sans-serif; }
      .label { fill: #e4e9ed; font: 600 20px 'Segoe UI', Arial, sans-serif; }
      .body { fill: #d5dce1; font: 18px 'Segoe UI', Arial, sans-serif; }
      .small { fill: #aeb9c2; font: 16px 'Segoe UI', Arial, sans-serif; }
      .tiny { fill: #aeb9c2; font: 14px 'Segoe UI', Arial, sans-serif; }
      .code { fill: #e8edf0; font: 18px Consolas, 'Courier New', monospace; }
      .code-small { fill: #e8edf0; font: 16px Consolas, 'Courier New', monospace; }
      .gold { fill: #f0c66b; }
      .green { fill: #8fd49f; }
      .blue { fill: #8fc3e7; }
      .purple { fill: #c0a1df; }
      .pos-fill { fill: #345449; }
      .uv-fill { fill: #364b5b; }
      .index-fill { fill: #4b3f58; }
      .select { fill: none; stroke: #e2b65d; stroke-width: 3; marker-end: url(#arrow-gold); }
      .capture { fill: none; stroke: #75bd88; stroke-width: 3; marker-end: url(#arrow-green); }
      .state { fill: none; stroke: #7aa5c4; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-blue); }
      .fetch { fill: none; stroke: #aa8bc8; stroke-width: 3; marker-end: url(#arrow-purple); }
      .grid { fill: none; stroke: #6d7b84; stroke-width: 1.5; }
    </style>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2b65d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#75bd88"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa5c4"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aa8bc8"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <text x="60" y="62" class="title">WebGL 顶点缓冲区的数据映射与配置状态</text>
  <text x="60" y="96" class="body">核心链路：shader attribute location → VAO attribute slot → 格式与偏移配置 → buffer object 原始字节</text>

  <rect x="38" y="125" width="1724" height="1040" rx="8" class="context"/>
  <text x="70" y="168" class="section">WebGLRenderingContext / GPU 状态</text>

  <!-- Shader interface -->
  <text x="75" y="215" class="section">Vertex shader inputs</text>
  <rect x="75" y="235" width="420" height="335" rx="8" class="shader"/>
  <text x="105" y="278" class="code">layout(location=0) in vec3</text>
  <text x="105" y="310" class="code">aPosition;</text>
  <rect x="105" y="333" width="350" height="62" rx="5" class="slot"/>
  <text x="125" y="371" class="code">aPosition → location 0</text>

  <text x="105" y="435" class="code">layout(location=1) in vec2</text>
  <text x="105" y="467" class="code">aTexCoord;</text>
  <rect x="105" y="490" width="350" height="62" rx="5" class="slot"/>
  <text x="125" y="528" class="code">aTexCoord → location 1</text>

  <!-- API setup -->
  <rect x="75" y="615" width="420" height="470" rx="8" class="api"/>
  <text x="105" y="657" class="section">配置操作（CPU / WebGL API）</text>
  <text x="105" y="700" class="code-small">gl.bindVertexArray(vao);</text>
  <text x="105" y="740" class="code-small">gl.bindBuffer(ARRAY_BUFFER, vbo);</text>
  <text x="105" y="780" class="code-small">gl.vertexAttribPointer(</text>
  <text x="128" y="810" class="code-small">0, 3, FLOAT, false, 20, 0);</text>
  <text x="105" y="845" class="code-small">gl.enableVertexAttribArray(0);</text>
  <text x="105" y="885" class="code-small">gl.vertexAttribPointer(</text>
  <text x="128" y="915" class="code-small">1, 2, FLOAT, false, 20, 12);</text>
  <text x="105" y="950" class="code-small">gl.enableVertexAttribArray(1);</text>
  <line x1="105" y1="977" x2="465" y2="977" stroke="#51606c" stroke-width="2"/>
  <text x="105" y="1012" class="body blue">vertexAttribPointer() 会把当时绑定的</text>
  <text x="105" y="1042" class="body blue">ARRAY_BUFFER 引用和解析格式一起保存</text>
  <text x="105" y="1072" class="body blue">到当前 VAO 的指定 attribute slot。</text>

  <!-- VAO state -->
  <text x="555" y="215" class="section">Vertex Array Object（映射与配置状态）</text>
  <rect x="545" y="235" width="610" height="850" rx="8" class="vao"/>

  <text x="575" y="277" class="label">Attribute slot 0</text>
  <rect x="575" y="300" width="550" height="205" rx="6" class="slot"/>
  <text x="600" y="338" class="code">enabled: true</text>
  <text x="600" y="372" class="code">size: 3, type: FLOAT</text>
  <text x="600" y="406" class="code">normalized: false</text>
  <text x="600" y="440" class="code">stride: 20, offset: 0</text>
  <text x="600" y="474" class="code green">buffer: VertexBuffer A</text>

  <text x="575" y="552" class="label">Attribute slot 1</text>
  <rect x="575" y="575" width="550" height="205" rx="6" class="slot"/>
  <text x="600" y="613" class="code">enabled: true</text>
  <text x="600" y="647" class="code">size: 2, type: FLOAT</text>
  <text x="600" y="681" class="code">normalized: false</text>
  <text x="600" y="715" class="code">stride: 20, offset: 12</text>
  <text x="600" y="749" class="code green">buffer: VertexBuffer A</text>

  <text x="575" y="827" class="label">其他 VAO 状态</text>
  <rect x="575" y="850" width="550" height="195" rx="6" class="slot"/>
  <text x="600" y="888" class="code">slot N: enabled / format / buffer</text>
  <text x="600" y="922" class="code">ELEMENT_ARRAY_BUFFER: IndexBuffer E</text>
  <text x="600" y="960" class="body">WebGL 2 / 实例化还可保存 divisor。</text>
  <text x="600" y="995" class="small">slot 未启用时，shader 收到 current generic</text>
  <text x="600" y="1023" class="small">attribute value，而不是从 buffer 取数。</text>

  <!-- Buffer objects -->
  <text x="1235" y="215" class="section">Buffer objects（上下文资源）</text>
  <rect x="1225" y="235" width="470" height="430" rx="8" class="buffer"/>
  <text x="1255" y="277" class="label green">VertexBuffer A</text>
  <text x="1255" y="312" class="body">原始字节；这里采用交错布局，stride = 20 bytes</text>

  <text x="1260" y="352" class="tiny">byte offset</text>
  <text x="1280" y="380" class="tiny">0</text>
  <text x="1350" y="380" class="tiny">4</text>
  <text x="1420" y="380" class="tiny">8</text>
  <text x="1490" y="380" class="tiny">12</text>
  <text x="1560" y="380" class="tiny">16</text>

  <rect x="1260" y="395" width="70" height="64" class="pos-fill"/>
  <rect x="1330" y="395" width="70" height="64" class="pos-fill"/>
  <rect x="1400" y="395" width="70" height="64" class="pos-fill"/>
  <rect x="1470" y="395" width="70" height="64" class="uv-fill"/>
  <rect x="1540" y="395" width="70" height="64" class="uv-fill"/>
  <rect x="1260" y="395" width="350" height="64" class="grid"/>
  <line x1="1330" y1="395" x2="1330" y2="459" class="grid"/>
  <line x1="1400" y1="395" x2="1400" y2="459" class="grid"/>
  <line x1="1470" y1="395" x2="1470" y2="459" class="grid"/>
  <line x1="1540" y1="395" x2="1540" y2="459" class="grid"/>
  <text x="1283" y="434" class="code-small">Px</text>
  <text x="1353" y="434" class="code-small">Py</text>
  <text x="1423" y="434" class="code-small">Pz</text>
  <text x="1494" y="434" class="code-small">U</text>
  <text x="1564" y="434" class="code-small">V</text>
  <text x="1260" y="486" class="small">Vertex 0</text>

  <rect x="1260" y="510" width="70" height="64" class="pos-fill"/>
  <rect x="1330" y="510" width="70" height="64" class="pos-fill"/>
  <rect x="1400" y="510" width="70" height="64" class="pos-fill"/>
  <rect x="1470" y="510" width="70" height="64" class="uv-fill"/>
  <rect x="1540" y="510" width="70" height="64" class="uv-fill"/>
  <rect x="1260" y="510" width="350" height="64" class="grid"/>
  <line x1="1330" y1="510" x2="1330" y2="574" class="grid"/>
  <line x1="1400" y1="510" x2="1400" y2="574" class="grid"/>
  <line x1="1470" y1="510" x2="1470" y2="574" class="grid"/>
  <line x1="1540" y1="510" x2="1540" y2="574" class="grid"/>
  <text x="1283" y="549" class="code-small">Px</text>
  <text x="1353" y="549" class="code-small">Py</text>
  <text x="1423" y="549" class="code-small">Pz</text>
  <text x="1494" y="549" class="code-small">U</text>
  <text x="1564" y="549" class="code-small">V</text>
  <text x="1260" y="601" class="small">Vertex 1 ...</text>
  <text x="1260" y="635" class="small"><tspan class="green">绿色字段</tspan>由 slot 0 解码；<tspan class="blue">蓝色字段</tspan>由 slot 1 解码。</text>

  <rect x="1225" y="705" width="470" height="180" rx="8" class="buffer"/>
  <text x="1255" y="747" class="label green">IndexBuffer E</text>
  <text x="1255" y="782" class="code">Uint16: [0, 1, 2, 2, 3, 0]</text>
  <text x="1255" y="817" class="body">仅由 drawElements() 读取，用来产生</text>
  <text x="1255" y="848" class="body">顶点索引；它不是 shader attribute。</text>

  <rect x="1225" y="925" width="470" height="160" rx="8" class="draw"/>
  <text x="1255" y="967" class="label purple">Draw 驱动实际取数</text>
  <text x="1255" y="1005" class="code-small">gl.drawElements(TRIANGLES, 6,</text>
  <text x="1280" y="1035" class="code-small">UNSIGNED_SHORT, 0);</text>
  <text x="1255" y="1068" class="small">索引 → 顶点号 → 各 slot 按 stride/offset 解码。</text>

  <!-- Mapping arrows -->
  <path d="M 455 364 C 515 364, 505 402, 545 402" class="select"/>
  <path d="M 455 521 C 515 521, 505 677, 545 677" class="select"/>
  <text x="474" y="348" class="small gold">location 0</text>
  <text x="474" y="565" class="small gold">location 1</text>

  <path d="M 1125 470 C 1185 470, 1175 427, 1225 427" class="capture"/>
  <path d="M 1125 745 C 1185 745, 1175 548, 1225 548" class="capture"/>
  <text x="1150" y="442" class="small green">同一 VBO</text>
  <text x="1150" y="686" class="small green">不同 offset</text>

  <path d="M 1125 922 C 1185 922, 1175 795, 1225 795" class="capture"/>
  <text x="1145" y="884" class="small green">VAO 保存引用</text>

  <path d="M 495 800 C 525 800, 515 765, 545 765" class="state"/>
  <text x="505" y="788" class="small blue">写入 slot</text>

  <path d="M 1460 885 L 1460 925" class="fetch"/>

  <text x="75" y="1118" class="small">图中 layout(location=...) 是 WebGL 2 写法；WebGL 1 使用 attribute，并通过 getAttribLocation() 查询或在链接前用 bindAttribLocation() 指定位置。</text>
  <text x="75" y="1148" class="small">关键区别：ARRAY_BUFFER 是配置时使用的当前绑定点，本身不是 VAO 状态；VAO 保存捕获到的 buffer 引用、格式、启用状态，以及 ELEMENT_ARRAY_BUFFER 绑定。</text>
</svg>
